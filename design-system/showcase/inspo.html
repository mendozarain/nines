<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nines · LYNK / Ofacc inspo board</title>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        font-family: "Plus Jakarta Sans", system-ui, sans-serif;
        background: #f3f5f7;
        color: #111827;
      }
      .page { width: 1600px; margin: 0 auto; padding: 40px; }
      h1 { font-size: 32px; letter-spacing: -0.03em; margin: 0 0 8px; }
      p { color: #6b7280; margin: 0 0 28px; max-width: 720px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      figure {
        margin: 0;
        background: #fff;
        border-radius: 16px;
        overflow: hidden;
        border: 1px solid #e5e7eb;
        box-shadow: 0 12px 32px rgba(16, 24, 40, 0.06);
      }
      figure img { display: block; width: 100%; height: auto; }
      figcaption {
        padding: 14px 16px;
        font-size: 13px;
        font-weight: 600;
        border-top: 1px solid #e5e7eb;
      }
      .wide { grid-column: 1 / -1; }
    </style>
  </head>
  <body>
    <div class="page">
      <h1>Inspo · LYNK / Ofacc+</h1>
      <p>
        Context frames for the Nines Design System: order detail + fulfillment,
        bundle line items, automation canvas, and AI dashboard. Translate into
        Nines books UI — not a logistics product clone.
      </p>
      <div class="grid">
        <figure class="wide">
          <img src="/inspo/166d3249-28a0-421e-83c5-d94990cb92b7.jpg" alt="Order detail fulfillment" />
          <figcaption>Order detail · fulfillment stepper · items table</figcaption>
        </figure>
        <figure>
          <img src="/inspo/14b397a5-0bf1-45ba-89da-b791d6914382.png" alt="Bundle hierarchy" />
          <figcaption>Bundle / kit hierarchy · SKU pills · status footer</figcaption>
        </figure>
        <figure>
          <img src="/inspo/5d0c673a-948e-4f9a-8925-d8de85a4253e.png" alt="Automation selected" />
          <figcaption>Automation · selected condition node</figcaption>
        </figure>
        <figure class="wide">
          <img src="/inspo/0ae204df-dba8-4e0e-ab74-e70009b45b7a.png" alt="Automation workflow" />
          <figcaption>Automation · trigger / condition / action tree</figcaption>
        </figure>
        <figure class="wide">
          <img src="/inspo/7218d431-1e43-4bf4-b76d-3fbdbba1d3fd.png" alt="AI dashboard" />
          <figcaption>Dashboard · AI hub · critical alerts · charts</figcaption>
        </figure>
      </div>
    </div>
  </body>
</html>
